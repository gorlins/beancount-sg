[project]
name = "beancount-sg"
dynamic = ["version"]
description = "Personal collection of Beancount plugins and Fava extensions"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "beancount>=3",
]

[project.optional-dependencies]
fava = ["fava>=1.30"]

[project.urls]
Repository = "https://github.com/gorlins/beancount-sg"

[dependency-groups]
dev = [
    "fava>=1.30",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Used when building without git metadata or tags (e.g. a shallow clone).
fallback_version = "0.0.0"

[tool.uv]
# Rebuild the editable install when commits or tags change, so the version stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_sg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
